services:
  postgres:
    image: postgres:16-alpine
    container_name: scraper-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scraper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scraper_pass}
      POSTGRES_DB: ${POSTGRES_DB:-scraper_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scraper} -d ${POSTGRES_DB:-scraper_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  prefect-server:
    image: prefecthq/prefect:3-latest
    container_name: scraper-prefect
    command: prefect server start --host 0.0.0.0 --port 4200
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://${POSTGRES_USER:-scraper}:${POSTGRES_PASSWORD:-scraper_pass}@postgres:5432/prefect
      PREFECT_UI_API_URL: ${PREFECT_UI_API_URL:-http://localhost:4200/api}
    ports:
      - "4200:4200"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    build: .
    container_name: scraper-worker
    command: prefect worker start --pool default
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      # Show the scraper's own log lines (login, search, scrolling...) in each run's Logs tab.
      PREFECT_LOGGING_EXTRA_LOGGERS: gt_linkedin_scraper
      PREFECT_LOGGING_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-scraper}:${POSTGRES_PASSWORD:-scraper_pass}@postgres:5432/${POSTGRES_DB:-scraper_db}
      LINKEDIN_USERNAME: ${LINKEDIN_USERNAME}
      LINKEDIN_PASSWORD: ${LINKEDIN_PASSWORD}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      JOBS_CONFIG_PATH: ${JOBS_CONFIG_PATH:-config/jobs.yaml}
      AUTH_STATE_PATH: /app/runtime/data/auth_state.json
      RESUME_UPLOAD_DIR: /app/runtime/resumes
      LOG_DIR: /app/runtime/logs
      EXTRACT_DIR: /app/runtime/extract
      DEBUG_DIR: /app/runtime/debug
    env_file:
      - .env
    volumes:
      - ./config:/app/config
      - ./runtime:/app/runtime
    depends_on:
      postgres:
        condition: service_healthy
      prefect-server:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G

  api:
    build: .
    container_name: scraper-api
    # Migrates the database, then serves the API (which registers Prefect deployments).
    command: sh -c "python scripts/migrate.py && uvicorn gt_linkedin_scraper.api.main:app --host 0.0.0.0 --port 8000"
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-scraper}:${POSTGRES_PASSWORD:-scraper_pass}@postgres:5432/${POSTGRES_DB:-scraper_db}
      LINKEDIN_USERNAME: ${LINKEDIN_USERNAME}
      LINKEDIN_PASSWORD: ${LINKEDIN_PASSWORD}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      JOBS_CONFIG_PATH: ${JOBS_CONFIG_PATH:-config/jobs.yaml}
      AUTH_STATE_PATH: /app/runtime/data/auth_state.json
      LOG_DIR: /app/runtime/logs
      EXTRACT_DIR: /app/runtime/extract
      DEBUG_DIR: /app/runtime/debug
    env_file:
      - .env
    volumes:
      - ./config:/app/config
      - ./runtime:/app/runtime
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      # The API registers Prefect deployments on startup, so Prefect must be up first.
      prefect-server:
        condition: service_healthy
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: scraper-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:80/')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Streamlit UI (original frontend)
  frontend:
    build:
      context: .
      dockerfile: apps/streamlit/Dockerfile
    container_name: scraper-frontend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-scraper}:${POSTGRES_PASSWORD:-scraper_pass}@postgres:5432/${POSTGRES_DB:-scraper_db}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:-scraper}:${POSTGRES_PASSWORD:-scraper_pass}@postgres:5432/${POSTGRES_DB:-scraper_db}
      RESUME_UPLOAD_DIR: /app/runtime/resumes
    env_file:
      - .env
    volumes:
      - ./apps/streamlit/.streamlit:/app/apps/streamlit/.streamlit:ro
      - ./runtime:/app/runtime
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Angular UI + web API (invite-only)
  frontend-v2:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: scraper-frontend-v2
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-scraper}:${POSTGRES_PASSWORD:-scraper_pass}@postgres:5432/${POSTGRES_DB:-scraper_db}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:-scraper}:${POSTGRES_PASSWORD:-scraper_pass}@postgres:5432/${POSTGRES_DB:-scraper_db}
      RESUME_UPLOAD_DIR: /app/runtime/resumes
      WEB_SECRET_KEY: ${WEB_SECRET_KEY:-}
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-http://localhost:8502}
      # Super admins manage scrape jobs here; changes are pushed to Prefect.
      PREFECT_API_URL: http://prefect-server:4200/api
    env_file:
      - .env
    volumes:
      - ./runtime:/app/runtime
    ports:
      - "8502:8502"
    depends_on:
      postgres:
        condition: service_healthy
      prefect-server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
