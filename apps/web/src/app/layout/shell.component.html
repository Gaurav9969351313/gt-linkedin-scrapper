<a class="skip-link" href="#main">Skip to content</a>

<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark"><app-icon name="shield" [size]="18" /></span>
      <span class="brand-text">
        <strong>LinkedIn Scraper</strong>
        <small class="muted">Console</small>
      </span>
    </div>

    <nav aria-label="Main">
      @for (item of nav(); track item.path) {
        <a class="nav-link" [routerLink]="item.path" routerLinkActive="active" ariaCurrentWhenActive="page">
          <app-icon [name]="item.icon" [size]="18" />
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="user">
      <span class="avatar" aria-hidden="true">{{ (auth.user()?.name ?? "?").charAt(0).toUpperCase() }}</span>
      <span class="user-name"><span>{{ auth.user()?.name }}</span><small class="muted">{{ roleLabel() }}</small></span>
      <button type="button" class="btn btn-ghost btn-icon" (click)="auth.logout()" aria-label="Log out" title="Log out">
        <app-icon name="logout" />
      </button>
    </div>
  </aside>

  <main id="main" class="content" tabindex="-1">
    <router-outlet />
  </main>
</div>
